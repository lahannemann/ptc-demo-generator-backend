name: Trigger auto deployment for demogeneratorserver

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/demogeneratorserver-AutoDeployTrigger-da22219d-4301-4239-9e24-1e9cad5eea3e.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEMOGENERATORSERVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEMOGENERATORSERVER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEMOGENERATORSERVER_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR (using Azure OIDC token)
        run: az acr login --name demogeneratoracr

      - name: Build and push Docker image (sha + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            demogeneratoracr.azurecr.io/demogeneratorserver:${{ github.sha }}
            demogeneratoracr.azurecr.io/demogeneratorserver:latest

      - name: Deploy to Azure Container Apps (latest)
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: demogeneratorserver
          resourceGroup: codebeamer-presales
          imageToDeploy: demogeneratoracr.azurecr.io/demogeneratorserver:latest
